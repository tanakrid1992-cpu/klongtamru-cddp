<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8956f">
<title>CDDP · เทศบาลตำบลคลองตำหรุ</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://mt0.google.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script defer src="config.js?v=2611271610"></script>
<script defer src="geo.js?v=2611271610"></script>
<script defer src="app.js?v=2611271610"></script>
<style>
/* ══ ธีมกระจกฝ้า (Glass) โทนอุ่น ══ */
:root{
  --tx:#2b2520;--mu:#6f655b;--mu2:#9a8f84;
  --ac:#f2683a;--ac2:#ff9a6b;--acd:#c2461c;--acs:rgba(242,104,58,.13);
  --tl:#14b8a6;--ok:#10a37f;--er:#e03e3e;--wa:#d97706;
  --g1:rgba(255,255,255,.34);--g2:rgba(255,255,255,.5);--g3:rgba(255,255,255,.72);
  --gb:rgba(255,255,255,.55);--ln:rgba(80,60,40,.1);--ln2:rgba(80,60,40,.18);
  --s1:var(--g2);--s2:rgba(255,255,255,.45);--s3:rgba(255,255,255,.6);--bg:rgba(255,255,255,.4);
  --r:24px;--ease:cubic-bezier(.22,.8,.26,1);
  --sh1:0 1px 0 rgba(255,255,255,.6) inset,0 8px 28px rgba(60,40,20,.1);
  --sh2:0 1px 0 rgba(255,255,255,.7) inset,0 24px 60px rgba(50,30,10,.22);
  --blur:blur(22px) saturate(1.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.55 'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--tx);overflow:hidden;
  background:
   radial-gradient(60% 55% at 22% 18%,rgba(255,244,224,.95),transparent 70%),
   radial-gradient(40% 45% at 82% 12%,rgba(255,236,210,.7),transparent 70%),
   radial-gradient(55% 40% at 50% 105%,rgba(70,45,25,.75),transparent 70%),
   linear-gradient(90deg,rgba(90,60,35,.35) 0 6%,transparent 6% 94%,rgba(90,60,35,.35) 94%),
   linear-gradient(180deg,#e8d6bd 0%,#d2b691 42%,#a8825d 72%,#6e4f34 100%)}
body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 120px),radial-gradient(30% 25% at 70% 60%,rgba(255,220,180,.35),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.i{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(80,60,40,.2);border-radius:8px}
.hide{display:none!important}
#prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:5000;background:linear-gradient(90deg,var(--ac),#fbbf24,var(--tl));transition:width .4s var(--ease),opacity .4s}

/* ── หน้าต่างกระจก ── */
.win{position:fixed;inset:18px;border-radius:36px;background:linear-gradient(160deg,rgba(255,255,255,.32),rgba(255,255,255,.14));
  backdrop-filter:blur(30px) saturate(1.3);-webkit-backdrop-filter:blur(30px) saturate(1.3);
  border:1px solid rgba(255,255,255,.5);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 40px 100px rgba(40,25,10,.3);display:flex;flex-direction:column;overflow:hidden}
.top{height:66px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px 0 22px}
.who{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 12px 6px 6px;border-radius:30px;transition:.2s;min-width:0;max-width:36%}
.who:hover{background:var(--g1)}
.av{width:36px;height:36px;border-radius:50%;flex:none;background:linear-gradient(135deg,#f6a06f,#e2683f);display:grid;place-items:center;font-weight:600;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.who>div{min-width:0}.who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{font-size:11.5px;color:var(--mu);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--tx);font-weight:500}.crumb .i{width:12px;height:12px}
.srch{position:relative;flex:1;max-width:520px;margin:0 auto}
.srch input{width:100%;height:42px;border-radius:24px;border:1px solid var(--gb);background:var(--g1);padding:0 44px 0 42px;outline:0;transition:.3s var(--ease);box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
.srch input::placeholder{color:var(--mu)}
.srch input:focus{background:var(--g3);box-shadow:0 0 0 4px rgba(242,104,58,.15)}
.srch>.i{position:absolute;left:14px;top:12px;color:var(--ac)}
.srch kbd{position:absolute;right:12px;top:11px;font:11px inherit;background:var(--g2);color:var(--mu);border-radius:7px;padding:1px 8px}
.qres{position:absolute;left:0;right:0;top:50px;max-height:64vh;overflow:auto;background:rgba(255,250,245,.9);backdrop-filter:var(--blur);border:1px solid var(--gb);border-radius:22px;box-shadow:var(--sh2);padding:6px;z-index:60;animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.qh{font-size:11px;color:var(--mu2);padding:8px 10px 4px;display:flex;justify-content:space-between}
.qi{display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:14px;cursor:pointer;transition:.15s}
.qi:hover,.qi.fc{background:rgba(255,255,255,.75)}
.qi .d{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:16px}
.qi b{display:block;font-weight:500;font-size:13.5px}.qi small{color:var(--mu);font-size:11.5px}
mark{background:rgba(242,104,58,.2);color:var(--acd);border-radius:4px;padding:0 1px}
.tr{display:flex;align-items:center;gap:8px}
.rb{width:40px;height:40px;border-radius:50%;background:var(--g1);border:1px solid var(--gb);display:grid;place-items:center;color:var(--tx);transition:.2s}
.rb:hover{background:var(--g3);transform:translateY(-1px)}
.demo{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(251,191,36,.3);color:#7c4a03}
.sync{font-size:11.5px;color:var(--mu);display:flex;gap:5px;align-items:center}.sync .i{width:14px;height:14px}
.menu{position:absolute;top:62px;left:18px;width:260px;background:rgba(255,250,245,.92);backdrop-filter:var(--blur);border:1px solid var(--gb);border-radius:22px;padding:8px;box-shadow:var(--sh2);opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top left;pointer-events:none;transition:.25s var(--ease);z-index:70}
.menu.sh{opacity:1;transform:none;pointer-events:auto}
.menu .mh{padding:8px 12px 10px;border-bottom:1px solid var(--ln);margin-bottom:4px;font-size:12px;color:var(--mu)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;text-align:left;transition:.15s}
.menu button:hover{background:rgba(255,255,255,.8);color:var(--acd)}
.menu hr{border:0;border-top:1px solid var(--ln);margin:4px 6px}

/* ── แถบไอคอนลอยด้านซ้าย ── */
#rail{position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:30px;background:var(--g1);border:1px solid var(--gb);box-shadow:var(--sh1);backdrop-filter:var(--blur)}
.ri{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#5a4f45;transition:.25s var(--ease);position:relative}
.ri:hover{background:var(--g2);color:var(--tx);transform:scale(1.06)}
.ri.on{background:#fff;color:var(--ac);box-shadow:0 6px 16px rgba(60,40,20,.18)}
.ri.on:after{content:'';position:absolute;left:-8px;top:50%;width:3px;height:18px;margin-top:-9px;border-radius:3px;background:var(--ac)}
.tip{position:fixed;z-index:9999;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);color:var(--tx);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;pointer-events:none;opacity:0;transform:scale(.94);transition:.18s;white-space:nowrap;box-shadow:0 8px 22px rgba(50,30,10,.2)}
.tip.sh{opacity:1;transform:none}

/* ── แถบแท็บลอยด้านล่าง ── */
#tabs{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:6px;max-width:calc(100% - 140px)}
.tabs-in{display:flex;gap:2px;padding:5px;border-radius:30px;background:var(--g1);border:1px solid var(--gb);box-shadow:var(--sh1);backdrop-filter:var(--blur);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs-in::-webkit-scrollbar{display:none}
.tab{height:36px;padding:0 15px;border-radius:20px;white-space:nowrap;font-size:13px;color:#4f453c;display:inline-flex;align-items:center;gap:6px;transition:.25s var(--ease)}
.tab:hover{background:var(--g2);color:var(--tx)}
.tab.on{background:#fff;color:var(--tx);font-weight:600;box-shadow:0 4px 12px rgba(60,40,20,.15)}
.tab em{font-style:normal;font-size:10.5px;color:var(--mu);background:rgba(80,60,40,.08);padding:0 6px;border-radius:8px}
.tab.on em{background:var(--acs);color:var(--acd)}
.tabplus{width:46px;height:46px;flex:none;border-radius:50%;background:#fff;color:var(--ac);display:grid;place-items:center;box-shadow:0 8px 20px rgba(60,40,20,.2);transition:.25s var(--ease)}
.tabplus:hover{transform:scale(1.08) rotate(90deg);background:var(--ac);color:#fff}

/* ── พื้นที่เนื้อหา ── */
.view{flex:1;overflow:auto;padding:4px 26px 92px 92px}
.page{animation:pin .55s var(--ease)}
@keyframes pin{from{opacity:0;filter:blur(14px);transform:scale(.985)}to{opacity:1;filter:none;transform:none}}
.st>*{animation:pin .55s var(--ease) both}
.st>*:nth-child(2){animation-delay:.06s}.st>*:nth-child(3){animation-delay:.12s}.st>*:nth-child(4){animation-delay:.18s}
.pt{display:flex;align-items:flex-end;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
.pt h1{font-size:28px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:12px;color:#241e19}
.pt h1 .em{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:23px;background:rgba(255,255,255,.6);box-shadow:var(--sh1)}
.pt p{color:var(--mu);font-size:13px;margin-top:2px}
.pt .sp{flex:1}
.card{background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,.28));border:1px solid var(--gb);border-radius:var(--r);box-shadow:var(--sh1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card>*{animation:cin .5s .12s var(--ease) both}
@keyframes cin{from{opacity:0}}
.ch{display:flex;align-items:center;gap:8px;padding:16px 18px 4px}
.ch h3{font-size:14px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px}
.ch h3 .i{color:var(--ac)}
.ch small{color:var(--mu2);font-size:11.5px}

/* ปุ่ม */
.btn{position:relative;overflow:hidden;height:40px;padding:0 16px;border-radius:22px;background:var(--g2);border:1px solid var(--gb);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:.2s;box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
.btn:hover{background:var(--g3);transform:translateY(-1px)}
.btn.pri{background:#2b2520;border-color:#2b2520;color:#fff;font-weight:600;box-shadow:0 8px 20px rgba(43,37,32,.3)}
.btn.pri:hover{background:#000}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn:disabled{opacity:.55;pointer-events:none}
.rip{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.6);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.ib{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:var(--mu);transition:.2s;flex:none}
.ib:hover{background:rgba(255,255,255,.75);color:var(--tx)}
.ib.dan:hover{background:#fde2e2;color:var(--er)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* แดชบอร์ด */
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:16px}
.k{border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s;border:1px solid var(--gb);box-shadow:var(--sh1);background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.3));backdrop-filter:blur(14px)}
.k:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.k .ki{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.75);font-size:18px}
.k small{display:block;color:var(--mu);font-size:12.5px;margin-top:10px}
.k b{display:block;font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.k.t1{background:linear-gradient(160deg,#18b8a0,#0f8f7d);color:#fff}.k.t1 small{color:rgba(255,255,255,.8)}.k.t1 .ki{background:rgba(255,255,255,.22)}
.dg{display:grid;grid-template-columns:1fr 360px;gap:16px}
.dg2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.grp{padding:4px 18px 16px}
.grp h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu2);margin:14px 0 4px;font-weight:600}
.br{display:grid;grid-template-columns:30px 1fr 30px;gap:10px;align-items:center;padding:6px;margin:0 -6px;border-radius:14px;cursor:pointer;transition:.2s}
.br:hover{background:rgba(255,255,255,.5)}
.br .e{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:rgba(255,255,255,.65)}
.br .t{display:flex;justify-content:space-between;font-size:12.5px;color:#4f453c}.br .t b{color:var(--tx);font-weight:600}
.bar{height:6px;border-radius:6px;background:rgba(80,60,40,.1);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;width:0;transition:width 1s var(--ease)}
.eye{width:30px;height:30px;border-radius:50%;color:var(--mu2);display:grid;place-items:center}
.eye:hover{background:#fff;color:var(--ac)}
.br.off .t,.br.off .bar,.br.off .e{opacity:.35}
.side-list{max-height:calc(100vh - 380px);overflow:auto}
.ins{padding:6px 12px 14px}
.in{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;cursor:pointer;transition:.2s}
.in:hover{background:rgba(255,255,255,.55);transform:translateX(3px)}
.in .x{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.in b{display:block;font-size:13px;font-weight:500}.in small{color:var(--mu);font-size:11.5px}
.in .n{margin-left:auto;font-weight:700;font-size:15px}
.x.w{background:#fdecc8;color:#a15c07}.x.e{background:#fde0dc;color:#c2341c}.x.v{background:rgba(255,255,255,.75);color:var(--ac)}.x.g{background:#d3f4ea;color:#0b7a5e}
.ok-all{display:flex;gap:10px;align-items:center;padding:16px;color:var(--ok)}

/* แผนที่ */
.mapcard{position:relative;height:calc(100vh - 380px);min-height:380px;overflow:hidden;padding:0}
.mapcard>*{animation:none}
.slot{position:absolute;inset:6px;border-radius:19px;overflow:hidden}
#mapBox{position:absolute;inset:0;border-radius:19px;overflow:hidden}
#map{position:absolute;inset:0;background:#d9cbb8}
.mt{position:absolute;top:12px;right:12px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mt button,.mt select{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);color:#4f453c;transition:.2s;box-shadow:0 4px 14px rgba(40,25,10,.18);display:grid;place-items:center}
.mt select{width:auto;border-radius:22px;padding:0 12px;font-size:12.5px;outline:0;cursor:pointer}
.mt button:hover{background:#fff;transform:translateY(-1px)}
.mt button.on{background:#2b2520;color:#fff;border-color:#2b2520}
.mcount{position:absolute;left:12px;top:12px;z-index:500;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);padding:7px 14px;border-radius:20px;font-size:12px;box-shadow:0 4px 14px rgba(40,25,10,.18);display:flex;gap:6px;align-items:center}
.mcount .i{width:14px;height:14px;color:var(--ac)}
.mact{position:absolute;left:12px;top:56px;z-index:500;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 80px)}
.mact .btn{backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(40,25,10,.18)}.mact .btn:not(.pri){background:rgba(255,255,255,.85)}
.tn{font-style:normal;font-size:11px;background:var(--acs);color:var(--acd);padding:0 7px;border-radius:9px}
body.tbl .mact [data-a=tbl]{background:#2b2520;color:#fff}body.tbl .mact [data-a=tbl] .tn{background:rgba(255,255,255,.2);color:#fff}
.pickbar{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:600;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);padding:8px 8px 8px 16px;border-radius:24px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh2);white-space:nowrap;animation:pop .3s var(--ease)}
.pickbar .i{color:var(--ac)}
body.picking #map{cursor:crosshair}
.leaflet-container{font-family:inherit;background:#d9cbb8}
.leaflet-popup-content-wrapper{border-radius:20px;background:rgba(255,252,248,.95);backdrop-filter:blur(12px);box-shadow:var(--sh2)}
.leaflet-popup-tip{background:rgba(255,252,248,.95)}
.leaflet-popup-content{margin:14px 16px;min-width:230px;font-size:13px}
.leaflet-bar{border:0!important;box-shadow:0 4px 14px rgba(40,25,10,.18)!important;border-radius:20px!important;overflow:hidden}
.leaflet-bar a{color:#4f453c!important;background:rgba(255,255,255,.85)!important;border-color:var(--ln)!important;width:38px!important;height:38px!important;line-height:38px!important}
.leaflet-control-attribution{background:rgba(255,255,255,.6)!important;border-radius:10px 0 0 0}
.pp h5{font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.pp h5 span{width:28px;height:28px;border-radius:10px;display:grid;place-items:center}
.pp dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.pp dt{color:var(--mu)}.pp dd{text-align:right;word-break:break-word;font-weight:500}
.pp .a{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
.pp a,.pp button{font-size:12px;padding:6px 12px;border-radius:16px;background:rgba(242,104,58,.12);color:var(--acd);text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.pp a:hover,.pp button:hover{background:rgba(242,104,58,.22)}
.pp .i{width:14px;height:14px}
.pulse{width:20px;height:20px;border-radius:50%;margin:-10px 0 0 -10px;border:3px solid var(--ac);animation:pl 1.4s ease-out 3}
@keyframes pl{from{transform:scale(.6);opacity:1}to{transform:scale(3.4);opacity:0}}
.mpin{width:100%;height:100%;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .2s var(--ease)}
.mpin span{transform:rotate(45deg);font-size:13px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.mpin.big span{font-size:16px}
.leaflet-marker-icon:hover .mpin{transform:rotate(-45deg) scale(1.18)}

/* หน้าหมวด + ตาราง */
.cm{height:calc(100vh - 230px)!important;min-height:420px}
.tpanel{position:fixed;left:110px;right:44px;bottom:84px;height:min(62vh,640px);z-index:1050;display:flex;flex-direction:column;border-radius:28px;background:rgba(255,250,245,.88);backdrop-filter:blur(26px) saturate(1.3);box-shadow:var(--sh2);transform:translateY(calc(100% + 120px));transition:transform .5s var(--ease);visibility:hidden;overflow:hidden}
body.tbl .tpanel{transform:none;visibility:visible}
.tpanel>*{animation:none}
.tbar{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
.tbar h3{font-size:14.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px;white-space:nowrap}.tbar h3 .i{color:var(--ac)}
.tbar h3 span{color:var(--mu);font-weight:400;font-size:13px}
.fin{position:relative;width:min(340px,100%)}
.fin input{width:100%;height:40px;border-radius:22px;border:1px solid var(--ln2);background:rgba(255,255,255,.7);padding:0 14px 0 38px;outline:0;transition:.2s}
.fin input:focus{background:#fff;box-shadow:0 0 0 4px rgba(242,104,58,.13)}
.fin .i{position:absolute;left:13px;top:11px;color:var(--mu2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:30px;padding:0 12px;border-radius:20px;border:1px solid var(--ln2);background:rgba(255,255,255,.65);font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:.2s}
.chip:hover{background:#fff}
.chip.on{background:#2b2520;border-color:#2b2520;color:#fff}
.chip em{font-style:normal;font-size:10.5px;opacity:.7}
.chip select{border:0;background:none;outline:0;font-size:12px;cursor:pointer}
.tw{overflow:auto;flex:1;border-top:1px solid var(--ln)}
.dtb{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.dtb thead th{position:sticky;top:0;z-index:2;background:#f7efe6;color:var(--mu);font-weight:600;font-size:12px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--ln);white-space:nowrap;cursor:pointer;user-select:none}
.dtb thead th:hover{color:var(--acd)}
.dtb td{padding:10px 12px;border-bottom:1px solid var(--ln);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.dtb tbody tr{cursor:pointer;transition:background .15s}
.dtb tbody tr:hover td{background:rgba(255,255,255,.75)}
.dtb tr.sel td{background:rgba(242,104,58,.1)}.dtb tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.dtb .n{width:44px;color:var(--mu2);text-align:right;font-size:12px}
.dtb .mu{color:var(--mu2)}
.dtb td.fl{overflow:visible;max-width:none;padding:10px 6px}
.dtb .act{position:sticky;right:0;text-align:right;width:1%}
.dtb tbody td.act{background:#fbf6f0;box-shadow:-8px 0 12px -10px rgba(60,40,20,.3)}
.dtb .act .ib{width:30px;height:30px}.dtb .act .ib:disabled{opacity:.3;pointer-events:none}
.bdg{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:10px;margin-right:2px;font-weight:500}
.bdg.w{background:#fdecc8;color:#a15c07}.bdg.e{background:#fde0dc;color:#c2341c}.bdg.v{background:rgba(242,104,58,.12);color:var(--acd)}
.more{margin:10px auto;display:flex}
.empty{text-align:center;color:var(--mu);padding:46px 20px}.empty div{font-size:44px;margin-bottom:6px;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.sk{border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.25) 25%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.25) 75%);background-size:300% 100%;animation:shm 1.3s infinite;border:1px solid var(--gb)}
@keyframes shm{from{background-position:100% 0}to{background-position:-100% 0}}

/* ฟอร์ม / โมดัล */
.ov{position:fixed;inset:0;background:rgba(40,25,10,.25);backdrop-filter:blur(3px);z-index:1100;opacity:0;pointer-events:none;transition:.35s}
.ov.sh{opacity:1;pointer-events:auto}
.dr{position:fixed;top:18px;right:18px;bottom:18px;width:min(580px,calc(100% - 36px));background:rgba(255,250,245,.9);backdrop-filter:blur(26px) saturate(1.3);border:1px solid var(--gb);border-radius:32px;z-index:1150;transform:translateX(110%);transition:transform .5s var(--ease);display:flex;flex-direction:column;box-shadow:var(--sh2);overflow:hidden}
.dr.sh{transform:none}
body.picking .dr{transform:translateX(110%)}body.picking .ov{opacity:0;pointer-events:none}
.dh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--ln)}
.dh h3{flex:1;font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px}
.dh h3 span{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:#fff}
.db{flex:1;overflow:auto;padding:20px 22px}
.df{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--ln)}
.df small{flex:1;color:var(--mu);font-size:11.5px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fd{display:flex;flex-direction:column;gap:6px}.fd.w{grid-column:1/-1}
.fd label{font-size:12.5px;color:var(--mu);font-weight:500;display:flex;gap:6px;align-items:center}
.fd label small{color:var(--mu2);font-weight:400}
.fd input,.fd select,.fd textarea{height:42px;border-radius:14px;border:1px solid var(--ln2);background:rgba(255,255,255,.75);padding:0 13px;outline:0;transition:.2s}
.fd textarea{height:auto;padding:10px 13px;resize:vertical}
.fd input:focus,.fd select:focus,.fd textarea:focus{background:#fff;border-color:var(--ac2);box-shadow:0 0 0 4px rgba(242,104,58,.13)}
.fd input:disabled{background:rgba(80,60,40,.06);color:var(--mu)}
.fd .hint{font-size:11.5px}
.fd .hint.e{color:var(--er)}.fd .hint.w{color:var(--wa)}.fd .hint.o{color:var(--ok)}
.fd.bad input{border-color:#f3a99c}
.loc{margin-top:18px;padding:16px;border-radius:20px;background:rgba(255,255,255,.55);border:1px dashed rgba(242,104,58,.45)}
.loc>b{display:flex;gap:8px;align-items:center;color:var(--acd)}
.loc .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.loc .nb{font-size:12px;margin-top:10px;color:var(--mu)}
.md{position:fixed;left:50%;top:50%;transform:translate(-50%,-47%) scale(.96);width:min(780px,94vw);max-height:88vh;background:rgba(255,250,245,.92);backdrop-filter:blur(26px);border:1px solid var(--gb);border-radius:30px;z-index:1160;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:.35s var(--ease);box-shadow:var(--sh2);overflow:hidden}
.md.sh{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.urow{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:center;padding:11px 13px;border-radius:16px;background:rgba(255,255,255,.55);margin-bottom:8px;font-size:13px}
.urow small{color:var(--mu);display:block;font-size:11px}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(80,60,40,.08);font-weight:500}
.tag.superadmin{background:rgba(242,104,58,.15);color:var(--acd)}.tag.admin{background:rgba(20,184,166,.15);color:#0f766e}
.pm{border:1px solid var(--ln);border-radius:18px;padding:12px 14px;margin-top:10px;background:rgba(255,255,255,.35)}
.pm h5{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
.pm .r{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12.5px}
.pm select{height:32px;border-radius:12px;background:#fff;border:1px solid var(--ln2);padding:0 8px}

/* ล็อกอิน */
.lg{position:fixed;inset:0;z-index:2000;display:grid;place-items:center}
.lgc{position:relative;width:min(400px,92vw);padding:34px 30px 28px;border-radius:34px;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.3));backdrop-filter:blur(30px) saturate(1.3);border:1px solid rgba(255,255,255,.6);box-shadow:var(--sh2);animation:pin .7s var(--ease)}
.logo{width:58px;height:58px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,#f6a06f,#e2683f);display:grid;place-items:center;font-weight:700;color:#fff;font-size:20px;box-shadow:0 10px 24px rgba(226,104,63,.4)}
.lgc h2{text-align:center;font-size:22px}.lgc>p{text-align:center;color:var(--mu);font-size:13px;margin-bottom:22px}
.lgc .fd{margin-bottom:14px}
.pw{position:relative}.pw input{width:100%;padding-right:44px}.pw button{position:absolute;right:4px;top:4px}
.err{background:rgba(253,224,220,.85);color:#a32a17;border-radius:14px;padding:10px 13px;font-size:13px;margin-bottom:14px;animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.srv{text-align:center;font-size:11.5px;color:var(--mu);margin-top:14px;display:flex;gap:6px;justify-content:center;align-items:center}
.srv i{width:7px;height:7px;border-radius:50%;background:#b8ab9d}.srv.ok i{background:var(--ok);box-shadow:0 0 0 4px rgba(16,163,127,.18)}
body.login .win{filter:blur(6px);opacity:.5;pointer-events:none}

.tst{position:fixed;left:50%;top:26px;transform:translate(-50%,-30px);opacity:0;z-index:3000;background:rgba(43,37,32,.92);backdrop-filter:blur(10px);color:#fff;padding:11px 18px;border-radius:24px;box-shadow:var(--sh2);transition:.4s var(--ease);pointer-events:none;display:flex;gap:9px;align-items:center;font-size:13.5px}
.tst.sh{opacity:1;transform:translate(-50%,0)}.tst.er{background:rgba(180,40,30,.94)}.tst .i{width:17px;height:17px}

@media(max-width:1380px){.kp{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1180px){.dg,.dg2{grid-template-columns:1fr}.side-list{max-height:none}}
@media(max-width:960px){
  .win{inset:0;border-radius:0;border:0}
  .top{padding:0 10px;gap:8px;height:60px}.who{max-width:none;padding:4px}.who>div{display:none}
  .srch kbd{display:none}
  #rail{top:auto;bottom:74px;left:50%;transform:translateX(-50%);flex-direction:row;padding:5px;gap:2px}
  .ri{width:38px;height:38px}.ri.on:after{display:none}
  #tabs{bottom:12px;max-width:calc(100% - 20px)}
  .view{padding:4px 12px 140px}
  .mapcard,.cm{height:calc(100vh - 290px)!important}
  .tpanel{left:8px;right:8px;bottom:8px;height:80vh}
  .kp{grid-template-columns:repeat(2,1fr);gap:10px}
  .fg{grid-template-columns:1fr}.pt h1{font-size:22px}
  .urow{grid-template-columns:1fr auto}.urow>:nth-child(2),.urow>:nth-child(3){display:none}
  .dr{inset:0;width:100%;border-radius:0}
  .menu{left:8px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="prog"></div>

<div class="win">
  <header class="top">
    <div class="who" id="meBtn"><span class="av" id="meAv">?</span><div><b id="meName">-</b><div class="crumb" id="crumb"></div></div></div>
    <div class="srch"><i data-ic="search"></i><input id="q" placeholder="ค้นหาชื่อ บ้านเลขที่ เบอร์โทร…" autocomplete="off"><kbd>/</kbd><div class="qres hide" id="qres"></div></div>
    <div class="tr">
      <span class="sync hide" id="sync"></span>
      <span class="demo hide" id="demoTag">โหมดทดลอง</span>
      <button class="rb" id="rfBtn" title="ดึงข้อมูลล่าสุด"><i data-ic="refresh"></i></button>
    </div>
    <div class="menu" id="menu">
      <div class="mh" id="meRole">-</div>
      <button data-m="refresh"><i data-ic="refresh"></i> ดึงข้อมูลล่าสุดจาก Sheet</button>
      <button data-m="sheet" id="mSheet"><i data-ic="sheet"></i> เปิด Google Sheet</button>
      <button data-m="export"><i data-ic="download"></i> ส่งออกข้อมูลทั้งหมด (JSON)</button>
      <button data-m="users" class="hide" id="mUsers"><i data-ic="users"></i> จัดการผู้ใช้และสิทธิ์</button>
      <hr>
      <button data-m="pw" id="mPw"><i data-ic="key"></i> เปลี่ยนรหัสผ่าน</button>
      <button data-m="out" id="mOut"><i data-ic="logout"></i> ออกจากระบบ</button>
    </div>
  </header>
  <nav id="rail"></nav>
  <div class="view" id="view"></div>
  <nav id="tabs"></nav>
  <button class="hide" id="addBtn"></button>
</div>

<div class="lg hide" id="login">
  <form class="lgc" id="lgForm" autocomplete="on">
    <div class="logo">คต</div>
    <h2>CDDP</h2>
    <p>ระบบข้อมูลเมืองดิจิทัล · เทศบาลตำบลคลองตำหรุ</p>
    <div class="err hide" id="lgErr"></div>
    <div class="fd"><label><i data-ic="user"></i> ชื่อผู้ใช้</label><input id="lgU" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
    <div class="fd"><label><i data-ic="lock"></i> รหัสผ่าน</label><div class="pw"><input id="lgP" type="password" autocomplete="current-password" required><button type="button" class="ib" id="lgEye" title="แสดงรหัส"><i data-ic="eye"></i></button></div></div>
    <button class="btn pri" style="width:100%;justify-content:center;height:46px;margin-top:6px" id="lgBtn"><span>เข้าสู่ระบบ</span></button>
    <div class="srv" id="srv"><i></i><span>กำลังเชื่อมต่อเซิร์ฟเวอร์…</span></div>
  </form>
</div>

<div id="mapHome" class="hide">
  <div id="mapBox">
    <div id="map"></div>
    <div class="mcount"><i data-ic="pin"></i><span id="mcount">0 จุด</span></div>
    <div class="mact hide" id="mact"></div>
    <div class="mt">
      <select id="baseSel" title="แผนที่ฐาน">
        <option value="gsat">🛰️ ดาวเทียม</option><option value="groad">🗺️ ถนน</option>
        <option value="esri">🌏 ดาวเทียมสำรอง</option><option value="light">☀️ สว่าง</option>
      </select>
      <button id="tBnd" class="on" data-tip="ขอบเขตเทศบาล"><i data-ic="landmark"></i></button>
      <button id="tRoad" data-tip="เส้นถนน"><i data-ic="road"></i></button>
      <button id="tWater" data-tip="ทางน้ำ/คลอง"><i data-ic="waves"></i></button>
      <button id="tLoc" data-tip="ตำแหน่งของฉัน"><i data-ic="locate"></i></button>
      <button id="tFit" data-tip="พอดีเขตเทศบาล"><i data-ic="fit"></i></button>
      <button id="tFs" data-tip="เต็มจอ"><i data-ic="full"></i></button>
    </div>
    <div class="pickbar hide" id="pickBar"><i data-ic="pin"></i> คลิกหรือลากหมุดเพื่อเลือกตำแหน่ง <button class="btn pri sm" id="pickDone"><i data-ic="check"></i> ใช้ตำแหน่งนี้</button></div>
  </div>
</div>

<div class="ov" id="ov"></div>
<aside class="dr" id="dr"></aside>
<div class="md" id="md"></div>
<div class="tip" id="tip"></div>
<div class="tst" id="tst"></div>
</body>
</html>
