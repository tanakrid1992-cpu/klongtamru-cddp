<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b5cf6">
<title>CDDP · เทศบาลตำบลคลองตำหรุ</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://mt0.google.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script defer src="config.js"></script>
<script defer src="geo.js"></script>
<script defer src="app.js"></script>
<style>
:root{
  --bg:#f7f5fc;--s1:#fff;--s2:#f3effb;--s3:#e9e2f8;--ln:#ece7f6;--ln2:#ddd4f1;
  --tx:#2a2440;--mu:#7c7494;--mu2:#a59fba;--ac:#8b5cf6;--ac2:#a78bfa;--acd:#6d28d9;--acs:#f1ebff;
  --ok:#10b981;--er:#ef4444;--wa:#f59e0b;
  --r:18px;--rail:76px;--side:260px;--ease:cubic-bezier(.22,.8,.26,1);
  --sh1:0 1px 2px rgba(76,29,149,.04),0 6px 20px rgba(76,29,149,.06);
  --sh2:0 2px 6px rgba(76,29,149,.06),0 18px 40px rgba(76,29,149,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.55 'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--tx);overflow:hidden;
  background:radial-gradient(900px 520px at 85% -10%,#ede4ff 0,transparent 60%),radial-gradient(700px 480px at -10% 105%,#e6f0ff 0,transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.i{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#ddd4f1;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#c9bbef}
.hide{display:none!important}
.app{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:100vh;height:100vh;transition:grid-template-columns .4s var(--ease)}
body.rail .app{grid-template-columns:var(--rail) 1fr}
#prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:5000;background:linear-gradient(90deg,var(--ac),#ec4899,var(--ac2));box-shadow:0 0 12px rgba(139,92,246,.6);transition:width .4s var(--ease),opacity .4s}

/* ── Sidebar ── */
.sb{height:100vh;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-width:0;position:relative;z-index:30}
.sb-h{display:flex;align-items:center;gap:11px;padding:16px 14px 10px;min-height:68px}
.logo{width:40px;height:40px;flex:none;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#c084fc);display:grid;place-items:center;font-weight:700;color:#fff;box-shadow:0 8px 20px rgba(139,92,246,.35);position:relative;overflow:hidden}
.logo:after{content:'';position:absolute;inset:-40%;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:shine 4.5s infinite}
@keyframes shine{0%,70%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.brand{min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.brand b{display:block;font-size:15.5px;letter-spacing:.01em}.brand small{color:var(--mu);font-size:11px}
.colbtn{width:32px;height:32px;border-radius:10px;color:var(--mu);display:grid;place-items:center;flex:none;transition:.25s}
.colbtn:hover{background:var(--s2);color:var(--ac)}
body.rail .brand{display:none}body.rail .sb-h{flex-direction:column;gap:8px}
body.rail .colbtn .i{transform:scaleX(-1)}
.nv{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:4px 12px 14px;position:relative}
.nv-g{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu2);font-weight:600;padding:14px 10px 6px;white-space:nowrap}
body.rail .nv-g{font-size:0;padding:0;border-top:1px solid var(--ln);margin:10px 8px}
.ni{position:relative;z-index:1;display:flex;align-items:center;gap:11px;height:40px;padding:0 10px;border-radius:12px;color:#5b5473;white-space:nowrap;cursor:pointer;transition:color .25s,background .25s,transform .2s}
.ni:hover{background:var(--s2);color:var(--acd);transform:translateX(2px)}
.ni.on{color:#fff;font-weight:600}.ni.on:hover{background:none;transform:none}
.ni .ic{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:9px;font-size:15px;background:color-mix(in srgb,var(--c) 14%,#fff);transition:.25s}
.ni.on .ic{background:rgba(255,255,255,.22)}
.ni .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.ni .ct{font-size:11px;min-width:26px;text-align:center;padding:1px 7px;border-radius:9px;background:var(--s2);color:var(--mu);font-weight:500}
.ni.on .ct{background:rgba(255,255,255,.25);color:#fff}
body.rail .ni{justify-content:center;padding:0}body.rail .ni .lb,body.rail .ni .ct{display:none}
.ind{position:absolute;left:12px;height:40px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#a78bfa);box-shadow:0 8px 22px rgba(139,92,246,.38);transition:transform .45s var(--ease),width .3s,opacity .2s;pointer-events:none;top:0}
.tip{position:fixed;z-index:9999;background:var(--tx);color:#fff;padding:6px 11px;border-radius:9px;font-size:12px;pointer-events:none;opacity:0;transform:translateX(-4px);transition:.18s;white-space:nowrap;box-shadow:var(--sh2)}
.tip.sh{opacity:1;transform:none}
.sb-f{border-top:1px solid var(--ln);padding:10px 12px;position:relative}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;cursor:pointer;transition:.2s;white-space:nowrap}
.me:hover{background:var(--s2)}
.av{width:36px;height:36px;border-radius:12px;flex:none;background:linear-gradient(135deg,#a78bfa,#f0abfc);display:grid;place-items:center;font-weight:600;color:#fff}
.me>div{min-width:0;flex:1;overflow:hidden}.me b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis}.me small{color:var(--mu);font-size:11px}
body.rail .me>div,body.rail .me>.i{display:none}body.rail .me{justify-content:center}
.menu{position:absolute;bottom:70px;left:12px;width:240px;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:6px;box-shadow:var(--sh2);opacity:0;transform:translateY(8px) scale(.97);transform-origin:bottom left;pointer-events:none;transition:.25s var(--ease);z-index:40}
.menu.sh{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border-radius:10px;text-align:left;color:#4b4463;transition:.15s}
.menu button:hover{background:var(--acs);color:var(--acd)}
.menu hr{border:0;border-top:1px solid var(--ln);margin:4px 6px}

/* ── Main ── */
.mn{display:flex;flex-direction:column;min-width:0;height:100vh}
.tb{height:68px;flex:none;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--ln);background:rgba(255,255,255,.55);backdrop-filter:blur(12px);position:relative;z-index:20}
.crumb{flex:1;min-width:0;color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.crumb b{color:var(--tx);font-weight:600}.crumb .i{width:14px;height:14px;color:var(--mu2)}
.ib.hb{display:none}
.srch{position:relative}
.srch input{width:280px;height:40px;border-radius:12px;border:1px solid var(--ln);background:#fff;padding:0 42px 0 38px;outline:0;transition:.3s var(--ease);box-shadow:var(--sh1)}
.srch input:focus{width:380px;border-color:var(--ac2);box-shadow:0 0 0 4px rgba(139,92,246,.14)}
.srch>.i{position:absolute;left:12px;top:11px;color:var(--mu2)}
.srch kbd{position:absolute;right:10px;top:10px;font:11px inherit;background:var(--s2);color:var(--mu);border-radius:6px;padding:1px 7px}
.qres{position:absolute;right:0;top:48px;width:420px;max-height:66vh;overflow:auto;background:#fff;border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh2);padding:6px;z-index:60;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.qh{font-size:11px;color:var(--mu2);padding:8px 10px 4px;display:flex;justify-content:space-between}
.qi{display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer;transition:.15s}
.qi:hover,.qi.fc{background:var(--acs)}
.qi .d{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:16px}
.qi b{display:block;font-weight:500;font-size:13.5px}.qi small{color:var(--mu);font-size:11.5px}
mark{background:#ede4ff;color:var(--acd);border-radius:4px;padding:0 1px}
.btn{position:relative;overflow:hidden;height:40px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid var(--ln);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:.2s;color:#4b4463;box-shadow:var(--sh1)}
.btn:hover{border-color:var(--ln2);color:var(--acd);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,#8b5cf6,#a78bfa);border:0;color:#fff;font-weight:600;box-shadow:0 8px 20px rgba(139,92,246,.35)}
.btn.pri:hover{box-shadow:0 12px 26px rgba(139,92,246,.45);color:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.dan{color:var(--er)}
.btn:disabled{opacity:.55;pointer-events:none}
.rip{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.55);animation:rip .6s ease-out;pointer-events:none}
.btn:not(.pri) .rip{background:rgba(139,92,246,.18)}
@keyframes rip{to{transform:scale(4);opacity:0}}
.ib{width:36px;height:36px;border-radius:11px;display:inline-grid;place-items:center;color:var(--mu);transition:.2s;flex:none}
.ib:hover{background:var(--acs);color:var(--acd)}
.ib.dan:hover{background:#fee2e2;color:var(--er)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

.view{flex:1;overflow:auto;padding:24px}
.page{animation:pin .5s var(--ease)}
@keyframes pin{from{opacity:0;filter:blur(8px);transform:translateY(12px)}to{opacity:1;filter:none;transform:none}}
.st>*{animation:pin .5s var(--ease) both}
.st>*:nth-child(2){animation-delay:.05s}.st>*:nth-child(3){animation-delay:.1s}.st>*:nth-child(4){animation-delay:.15s}.st>*:nth-child(5){animation-delay:.2s}.st>*:nth-child(6){animation-delay:.25s}
.pt{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pt h1{font-size:26px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:12px}
.pt h1 .em{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--c) 15%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,#fff)}
.pt p{color:var(--mu);font-size:13px;margin-top:2px}
.pt .sp{flex:1}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh1)}
.ch{display:flex;align-items:center;gap:8px;padding:15px 18px 4px}
.ch h3{font-size:14.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px}
.ch h3 .i{color:var(--ac)}
.ch small{color:var(--mu2);font-size:11.5px}

/* KPI */
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:16px}
.k{border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s;border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh1);cursor:default}
.k:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.k .ki{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.75);font-size:19px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.k small{display:block;color:#5d5675;font-size:12.5px;margin-top:10px}
.k b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.k:after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;right:-40px;top:-40px;background:rgba(255,255,255,.35)}
.t1{background:linear-gradient(150deg,#ede9fe,#ddd6fe)}.t2{background:linear-gradient(150deg,#d1fae5,#c7f0e3)}
.t3{background:linear-gradient(150deg,#ffedd5,#fde3c4)}.t4{background:linear-gradient(150deg,#fce7f3,#f9d5ea)}
.t5{background:linear-gradient(150deg,#fee2e2,#fdd3d3)}.t6{background:linear-gradient(150deg,#e0f2fe,#d2e9fb)}
.dg{display:grid;grid-template-columns:1fr 360px;gap:16px}
.dg2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.grp{padding:4px 18px 16px}
.grp h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu2);margin:14px 0 4px;font-weight:600}
.br{display:grid;grid-template-columns:30px 1fr 30px;gap:10px;align-items:center;padding:6px 6px;margin:0 -6px;border-radius:11px;cursor:pointer;transition:.2s}
.br:hover{background:var(--s2)}
.br .e{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:color-mix(in srgb,var(--c) 13%,#fff)}
.br .t{display:flex;justify-content:space-between;font-size:12.5px;color:#4b4463}.br .t b{color:var(--tx);font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--s2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;width:0;transition:width 1s var(--ease)}
.eye{width:30px;height:30px;border-radius:9px;color:var(--mu2);display:grid;place-items:center}
.eye:hover{background:#fff;color:var(--ac)}
.br.off .t,.br.off .bar,.br.off .e{opacity:.35}
.side-list{max-height:calc(100vh - 330px);overflow:auto}
.ins{padding:6px 12px 14px}
.in{display:flex;align-items:center;gap:12px;padding:10px;border-radius:13px;cursor:pointer;transition:.2s}
.in:hover{background:var(--s2);transform:translateX(3px)}
.in .x{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.in b{display:block;font-size:13px;font-weight:500}.in small{color:var(--mu);font-size:11.5px}
.in .n{margin-left:auto;font-weight:700;font-size:15px}
.x.w{background:#fef3c7;color:#b45309}.x.e{background:#fee2e2;color:#dc2626}.x.v{background:var(--acs);color:var(--ac)}.x.g{background:#d1fae5;color:#059669}
.ok-all{display:flex;gap:10px;align-items:center;padding:16px;color:#059669}

/* Map */
.mapcard{position:relative;height:calc(100vh - 320px);min-height:400px;overflow:hidden}
.slot{position:absolute;inset:0}
#mapBox{position:absolute;inset:0;border-radius:var(--r);overflow:hidden}
#map{position:absolute;inset:0;background:#ece8f5}
.mt{position:absolute;top:12px;right:12px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mt button,.mt select{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--ln);color:#5b5473;transition:.2s;box-shadow:var(--sh1);display:grid;place-items:center}
.mt select{width:auto;padding:0 10px;font-size:12.5px;outline:0;cursor:pointer}
.mt button:hover{color:var(--ac);transform:translateY(-1px)}
.mt button.on{background:linear-gradient(135deg,#8b5cf6,#a78bfa);color:#fff;border-color:transparent}
.mcount{position:absolute;left:12px;top:12px;z-index:500;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--ln);padding:7px 13px;border-radius:20px;font-size:12px;box-shadow:var(--sh1);display:flex;gap:6px;align-items:center}
.mcount .i{width:14px;height:14px;color:var(--ac)}
.pickbar{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:600;background:#fff;border:1px solid var(--ac2);padding:8px 8px 8px 16px;border-radius:16px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh2);white-space:nowrap;animation:pop .3s var(--ease)}
.pickbar .i{color:var(--ac)}
body.picking #map{cursor:crosshair}
.leaflet-container{font-family:inherit;background:#ece8f5}
.leaflet-popup-content-wrapper{border-radius:16px;box-shadow:var(--sh2);border:1px solid var(--ln)}
.leaflet-popup-content{margin:14px 16px;min-width:230px;font-size:13px}
.leaflet-bar{border:0!important;box-shadow:var(--sh1)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{color:#5b5473!important;border-color:var(--ln)!important;width:36px!important;height:36px!important;line-height:36px!important}
.pp h5{font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.pp h5 span{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.pp dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;max-height:220px;overflow:auto}
.pp dt{color:var(--mu)}.pp dd{text-align:right;word-break:break-word;font-weight:500}
.pp .a{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
.pp a,.pp button{font-size:12px;padding:6px 11px;border-radius:9px;background:var(--acs);color:var(--acd);text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.pp a:hover,.pp button:hover{background:var(--s3)}
.pp .i{width:14px;height:14px}
.pulse{width:20px;height:20px;border-radius:50%;margin:-10px 0 0 -10px;border:3px solid var(--ac);animation:pl 1.4s ease-out 3}
@keyframes pl{from{transform:scale(.6);opacity:1}to{transform:scale(3.4);opacity:0}}

/* Category */
.cg{display:grid;grid-template-columns:minmax(360px,460px) 1fr;gap:16px}
.cg .mapcard{height:calc(100vh - 190px)}
.lst{height:calc(100vh - 190px);min-height:420px;display:flex;flex-direction:column}
.fl{padding:14px 14px 6px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--ln)}
.fin{position:relative}
.fin input{width:100%;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);padding:0 12px 0 36px;outline:0;transition:.2s}
.fin input:focus{border-color:var(--ac2);background:#fff;box-shadow:0 0 0 4px rgba(139,92,246,.12)}
.fin .i{position:absolute;left:11px;top:11px;color:var(--mu2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:30px;padding:0 12px;border-radius:20px;border:1px solid var(--ln);background:#fff;font-size:12px;color:#5b5473;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:.2s}
.chip:hover{border-color:var(--ac2);color:var(--acd)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip em{font-style:normal;font-size:10.5px;opacity:.75}
.chip select{border:0;background:none;outline:0;font-size:12px;cursor:pointer;color:inherit}
.items{flex:1;overflow:auto;padding:8px 10px 12px}
.it{display:flex;gap:11px;padding:11px;border-radius:14px;cursor:pointer;transition:background .2s,transform .2s;align-items:flex-start;animation:pin .4s var(--ease) both}
.it:hover{background:var(--s2)}
.it.sel{background:var(--acs);box-shadow:inset 3px 0 0 var(--ac)}
.it .dot{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:15px;background:color-mix(in srgb,var(--c) 14%,#fff)}
.it .b{flex:1;min-width:0}
.it b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .s{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--mu);margin-top:1px}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1px 8px;border-radius:10px;margin:4px 4px 0 0;font-weight:500}
.bdg.w{background:#fef3c7;color:#b45309}.bdg.e{background:#fee2e2;color:#dc2626}.bdg.v{background:var(--acs);color:var(--acd)}
.it .ac{display:flex;gap:2px;opacity:0;transition:.2s}.it:hover .ac,.it.sel .ac{opacity:1}
.more{margin:10px auto;display:flex}
.empty{text-align:center;color:var(--mu);padding:50px 20px}.empty div{font-size:44px;margin-bottom:6px;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--s2) 25%,#fbf9ff 50%,var(--s2) 75%);background-size:300% 100%;animation:shm 1.3s infinite}
@keyframes shm{from{background-position:100% 0}to{background-position:-100% 0}}

/* Drawer / Modal */
.ov{position:fixed;inset:0;background:rgba(42,36,64,.28);backdrop-filter:blur(4px);z-index:1100;opacity:0;pointer-events:none;transition:.35s}
.ov.sh{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:#fff;z-index:1150;transform:translateX(105%);transition:transform .45s var(--ease);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(76,29,149,.15)}
.dr.sh{transform:none}
body.picking .dr{transform:translateX(105%)}body.picking .ov{opacity:0;pointer-events:none}
.dh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--ln)}
.dh h3{flex:1;font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px}
.dh h3 span{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.db{flex:1;overflow:auto;padding:20px 22px}
.df{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--ln);background:var(--bg)}
.df small{flex:1;color:var(--mu);font-size:11.5px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fd{display:flex;flex-direction:column;gap:6px}.fd.w{grid-column:1/-1}
.fd label{font-size:12.5px;color:#5d5675;font-weight:500;display:flex;gap:6px;align-items:center}
.fd label small{color:var(--mu2);font-weight:400}
.fd input,.fd select,.fd textarea{height:42px;border-radius:12px;border:1px solid var(--ln2);background:#fff;padding:0 13px;outline:0;transition:.2s}
.fd textarea{height:auto;padding:10px 13px;resize:vertical}
.fd input:focus,.fd select:focus,.fd textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(139,92,246,.13)}
.fd input:disabled{background:var(--s2);color:var(--mu)}
.fd .hint{font-size:11.5px;min-height:0}
.fd .hint.e{color:var(--er)}.fd .hint.w{color:#b45309}.fd .hint.o{color:#059669}
.fd.bad input{border-color:#fca5a5}
.loc{margin-top:18px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#faf7ff,#f3efff);border:1px dashed var(--ac2)}
.loc>b{display:flex;gap:8px;align-items:center;color:var(--acd)}
.loc .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.loc .nb{font-size:12px;margin-top:10px;color:var(--mu)}
.warn{margin-top:14px;padding:12px 14px;border-radius:13px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12.5px;display:flex;gap:9px}
.md{position:fixed;left:50%;top:50%;transform:translate(-50%,-47%) scale(.96);width:min(780px,94vw);max-height:88vh;background:#fff;border-radius:22px;z-index:1160;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:.35s var(--ease);box-shadow:var(--sh2)}
.md.sh{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.urow{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:center;padding:11px 13px;border-radius:14px;background:var(--bg);margin-bottom:8px;font-size:13px;transition:.2s}
.urow:hover{background:var(--s2)}
.urow small{color:var(--mu);display:block;font-size:11px}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;background:#eef2f7;color:#475569;font-weight:500}
.tag.superadmin{background:#ede4ff;color:var(--acd)}.tag.admin{background:#e0f2fe;color:#0369a1}
.pm{border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-top:10px}
.pm h5{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
.pm .r{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12.5px}
.pm select{height:32px;border-radius:9px;background:#fff;border:1px solid var(--ln2);padding:0 8px}

/* Login */
.lg{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,#f5f0ff,#ede7fb 50%,#f8f5ff)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:bl 16s ease-in-out infinite alternate;will-change:transform}
.blob.a{width:420px;height:420px;background:#c4b5fd;left:-120px;top:-80px}
.blob.b{width:380px;height:380px;background:#f0abfc;right:-100px;bottom:-100px;animation-delay:-6s}
.blob.c{width:300px;height:300px;background:#a5f3fc;right:20%;top:10%;animation-delay:-11s;opacity:.35}
@keyframes bl{to{transform:translate(60px,40px) scale(1.15)}}
.lgc{position:relative;width:min(400px,92vw);padding:34px 30px 28px;border-radius:26px;background:rgba(255,255,255,.78);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);box-shadow:0 30px 80px rgba(76,29,149,.18);animation:pin .6s var(--ease)}
.lgc .logo{width:58px;height:58px;margin:0 auto 14px;font-size:20px;border-radius:18px}
.lgc h2{text-align:center;font-size:21px}.lgc>p{text-align:center;color:var(--mu);font-size:13px;margin-bottom:22px}
.lgc .fd{margin-bottom:14px}
.pw{position:relative}.pw input{width:100%;padding-right:44px}.pw button{position:absolute;right:4px;top:3px}
.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:12px;padding:10px 13px;font-size:13px;margin-bottom:14px;animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.srv{text-align:center;font-size:11.5px;color:var(--mu2);margin-top:14px;display:flex;gap:6px;justify-content:center;align-items:center}
.srv i{width:7px;height:7px;border-radius:50%;background:#d4d4d8}.srv.ok i{background:var(--ok);box-shadow:0 0 0 4px rgba(16,185,129,.15)}

.tst{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;z-index:3000;background:var(--tx);color:#fff;padding:11px 18px;border-radius:14px;box-shadow:var(--sh2);transition:.4s var(--ease);pointer-events:none;display:flex;gap:9px;align-items:center;font-size:13.5px}
.tst.sh{opacity:1;transform:translate(-50%,0)}.tst.er{background:#b91c1c}.tst .i{width:17px;height:17px}
.demo{font-size:11px;padding:3px 10px;border-radius:20px;background:#fef3c7;color:#92400e}
.sync{font-size:11.5px;color:var(--mu2);display:flex;gap:5px;align-items:center}.sync .i{width:14px;height:14px}

@media(max-width:1380px){.kp{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1180px){.dg,.dg2{grid-template-columns:1fr}.side-list{max-height:none}}
@media(max-width:960px){
  .app,body.rail .app{grid-template-columns:1fr}
  .sb{position:fixed;inset:0 auto 0 0;width:280px;transform:translateX(-102%);transition:transform .4s var(--ease)}
  body.nav .sb{transform:none;box-shadow:20px 0 60px rgba(76,29,149,.2)}
  body.nav .ov{opacity:1;pointer-events:auto}
  body.rail .brand{display:block}body.rail .ni{justify-content:flex-start;padding:0 10px}body.rail .ni .lb,body.rail .ni .ct{display:inline}
  body.rail .nv-g{font-size:10.5px;padding:14px 10px 6px;border:0;margin:0}
  .colbtn{display:none}.ib.hb{display:inline-grid}
  .tb{padding:0 10px;height:60px}.crumb .c2{display:none}
  .srch input,.srch input:focus{width:150px}.srch kbd{display:none}.qres{width:min(420px,94vw);right:-50px}
  .view{padding:14px}.cg{grid-template-columns:1fr}
  .lst{height:auto;min-height:0}.items{max-height:52vh}
  .mapcard,.cg .mapcard{height:58vh}.kp{grid-template-columns:repeat(2,1fr);gap:10px}
  .fg{grid-template-columns:1fr}.pt h1{font-size:21px}
  .urow{grid-template-columns:1fr auto}.urow>:nth-child(2),.urow>:nth-child(3){display:none}
  #addTxt{display:none}
}

/* ตาราง + ปุ่มบนแผนที่ */
.cm{height:min(56vh,560px)!important;min-height:360px;margin-bottom:16px}
.mact{position:absolute;left:12px;top:56px;z-index:500;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 80px)}
.mact .btn{backdrop-filter:blur(10px)}.mact .btn:not(.pri){background:rgba(255,255,255,.94)}
.tcard{overflow:hidden}
.tbar{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
.tbar h3{font-size:14.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px;white-space:nowrap}.tbar h3 .i{color:var(--ac)}
.tbar h3 span{color:var(--mu);font-weight:400;font-size:13px}
.tbar .fin{width:min(340px,100%)}
.tw{overflow:auto;max-height:calc(100vh - 200px);border-top:1px solid var(--ln)}
.dtb{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.dtb thead th{position:sticky;top:0;z-index:2;background:#faf8ff;color:#5d5675;font-weight:600;font-size:12px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--ln);white-space:nowrap;cursor:pointer;user-select:none;transition:.15s}
.dtb thead th:hover{color:var(--acd);background:var(--acs)}
.dtb td{padding:10px 12px;border-bottom:1px solid var(--ln);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.dtb tbody tr{cursor:pointer;transition:background .15s;animation:pin .35s var(--ease) both}
.dtb tbody tr:nth-child(-n+15){animation-delay:calc(var(--d,0) * 1ms)}
.dtb tbody tr:nth-child(even){background:#fcfbff}
.dtb tbody tr:hover{background:var(--s2)}
.dtb tr.sel td{background:var(--acs)}.dtb tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.dtb .n{width:44px;color:var(--mu2);text-align:right;font-size:12px}
.dtb .mu{color:var(--mu2)}
.dtb td.fl{width:1%;padding:10px 6px}.dtb .fl .bdg{display:inline-block;width:auto;margin:0 2px 0 0;padding:1px 5px}
.dtb .act{position:sticky;right:0;background:inherit;text-align:right;width:1%}
.dtb tbody td.act{background:#fff;box-shadow:-8px 0 12px -10px rgba(76,29,149,.25)}
.dtb tbody tr:hover td.act,.dtb tr.sel td.act{background:var(--s2)}
.dtb .act .ib{width:30px;height:30px}.dtb .act .ib:disabled{opacity:.3;pointer-events:none}
.tw .empty{padding:40px}
@media(max-width:960px){.cm{height:46vh!important}.tw{max-height:70vh}.mact{top:52px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="prog"></div>

<div class="lg hide" id="login">
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
  <form class="lgc" id="lgForm" autocomplete="on">
    <div class="logo">คต</div>
    <h2>CDDP</h2>
    <p>ระบบข้อมูลเมืองดิจิทัล · เทศบาลตำบลคลองตำหรุ</p>
    <div class="err hide" id="lgErr"></div>
    <div class="fd"><label><i data-ic="user"></i> ชื่อผู้ใช้</label><input id="lgU" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
    <div class="fd"><label><i data-ic="lock"></i> รหัสผ่าน</label><div class="pw"><input id="lgP" type="password" autocomplete="current-password" required><button type="button" class="ib" id="lgEye" title="แสดงรหัส"><i data-ic="eye"></i></button></div></div>
    <button class="btn pri" style="width:100%;justify-content:center;height:46px;margin-top:6px" id="lgBtn"><span>เข้าสู่ระบบ</span></button>
    <div class="srv" id="srv"><i></i><span>กำลังเชื่อมต่อเซิร์ฟเวอร์…</span></div>
  </form>
</div>

<div class="app">
  <aside class="sb" id="sb">
    <div class="sb-h">
      <div class="logo">คต</div>
      <div class="brand"><b>CDDP</b><small>เทศบาลตำบลคลองตำหรุ</small></div>
      <button class="colbtn" id="colBtn" title="ย่อ/ขยายเมนู"><i data-ic="panel"></i></button>
    </div>
    <nav class="nv" id="nav"><div class="ind" id="ind"></div><div id="navIn"></div></nav>
    <div class="sb-f">
      <div class="me" id="meBtn"><span class="av" id="meAv">?</span><div><b id="meName">-</b><small id="meRole">-</small></div><i data-ic="chev"></i></div>
      <div class="menu" id="menu">
        <button data-m="refresh"><i data-ic="refresh"></i> ดึงข้อมูลล่าสุดจาก Sheet</button>
        <button data-m="sheet" id="mSheet"><i data-ic="sheet"></i> เปิด Google Sheet</button>
        <button data-m="export"><i data-ic="download"></i> ส่งออกข้อมูลทั้งหมด (JSON)</button>
        <button data-m="users" class="hide" id="mUsers"><i data-ic="users"></i> จัดการผู้ใช้และสิทธิ์</button>
        <hr>
        <button data-m="pw" id="mPw"><i data-ic="key"></i> เปลี่ยนรหัสผ่าน</button>
        <button data-m="out" id="mOut"><i data-ic="logout"></i> ออกจากระบบ</button>
      </div>
    </div>
  </aside>

  <main class="mn">
    <header class="tb">
      <button class="ib hb" id="hbBtn"><i data-ic="menu"></i></button>
      <div class="crumb" id="crumb"></div>
      <span class="sync hide" id="sync"></span>
      <span class="demo hide" id="demoTag">โหมดทดลอง</span>
      <div class="srch"><i data-ic="search"></i><input id="q" placeholder="ค้นหาชื่อ บ้านเลขที่ เบอร์โทร…" autocomplete="off"><kbd>/</kbd><div class="qres hide" id="qres"></div></div>
      <button class="btn pri hide" id="addBtn"><i data-ic="plus"></i><span id="addTxt">เพิ่มข้อมูล</span></button>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div id="mapHome" class="hide">
  <div id="mapBox">
    <div id="map"></div>
    <div class="mcount"><i data-ic="pin"></i><span id="mcount">0 จุด</span></div>
    <div class="mact hide" id="mact"></div>
    <div class="mt">
      <select id="baseSel" title="แผนที่ฐาน">
        <option value="gsat">🛰️ ดาวเทียม</option><option value="groad">🗺️ ถนน</option>
        <option value="esri">🌏 ดาวเทียมสำรอง</option><option value="light">☀️ สว่าง</option>
      </select>
      <button id="tBnd" class="on" data-tip="ขอบเขตเทศบาล"><i data-ic="landmark"></i></button>
      <button id="tRoad" data-tip="เส้นถนน"><i data-ic="road"></i></button>
      <button id="tWater" data-tip="ทางน้ำ/คลอง"><i data-ic="waves"></i></button>
      <button id="tLoc" data-tip="ตำแหน่งของฉัน"><i data-ic="locate"></i></button>
      <button id="tFit" data-tip="พอดีเขตเทศบาล"><i data-ic="fit"></i></button>
      <button id="tFs" data-tip="เต็มจอ"><i data-ic="full"></i></button>
    </div>
    <div class="pickbar hide" id="pickBar"><i data-ic="pin"></i> คลิกหรือลากหมุดเพื่อเลือกตำแหน่ง <button class="btn pri sm" id="pickDone"><i data-ic="check"></i> ใช้ตำแหน่งนี้</button></div>
  </div>
</div>

<div class="ov" id="ov"></div>
<aside class="dr" id="dr"></aside>
<div class="md" id="md"></div>
<div class="tip" id="tip"></div>
<div class="tst" id="tst"></div>
</body>
</html>
