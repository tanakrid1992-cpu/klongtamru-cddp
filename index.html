<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDDP · เทศบาลตำบลคลองตำหรุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="geo.js"></script>
<style>
:root{
  --bg:#13161b;--s1:#1b1f26;--s2:#222731;--s3:#2b313c;--ln:rgba(255,255,255,.07);
  --tx:#ece9e4;--mu:#8d949f;--ac:#f2873a;--ac2:#ffb070;--ok:#34d399;--er:#f87171;
  --r:16px;--rail:72px;--side:252px;--ease:cubic-bezier(.22,.8,.26,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.5 'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--tx);background:
  radial-gradient(1200px 600px at 80% -10%,rgba(242,135,58,.10),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(45,212,191,.06),transparent 60%),var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:8px}
.hide{display:none!important}

/* ── Layout ── */
.app{display:grid;grid-template-columns:var(--side) 1fr;height:100vh;transition:grid-template-columns .35s var(--ease)}
body.rail .app{grid-template-columns:var(--rail) 1fr}

/* ── Sidebar (แบบในวิดีโอ: ย่อเป็นไอคอน/ขยายมีชื่อ) ── */
.sb{background:rgba(22,25,31,.92);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-width:0;position:relative;z-index:20}
.sb-h{display:flex;align-items:center;gap:10px;padding:16px 14px 12px;height:64px}
.logo{width:38px;height:38px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--ac),#e5602a);display:grid;place-items:center;font-weight:700;color:#fff;box-shadow:0 6px 18px rgba(242,135,58,.35)}
.brand{min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.brand b{display:block;font-size:15px}.brand small{color:var(--mu);font-size:11px}
.colbtn{width:30px;height:30px;border-radius:8px;color:var(--mu);display:grid;place-items:center;flex:none;transition:.2s}
.colbtn:hover{background:var(--s2);color:var(--tx)}
body.rail .brand{display:none}
body.rail .sb-h{flex-direction:column;height:auto;gap:8px}
.nv{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 10px 12px;position:relative}
.nv-g{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#5f6671;padding:14px 10px 6px;white-space:nowrap}
body.rail .nv-g{font-size:0;padding:8px 0;border-top:1px solid var(--ln);margin:6px 8px 0}
.ni{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:38px;padding:0 10px;border-radius:11px;color:#b9bec6;white-space:nowrap;cursor:pointer;transition:color .2s,background .2s}
.ni:hover{background:rgba(255,255,255,.04);color:#fff}
.ni.on{color:#1b1209;font-weight:600}
.ni .ic{width:22px;text-align:center;flex:none;font-size:15px}
.ni .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.ni .ct{font-size:11px;min-width:24px;text-align:center;padding:1px 7px;border-radius:9px;background:var(--s2);color:var(--mu)}
.ni.on .ct{background:rgba(0,0,0,.18);color:#1b1209}
body.rail .ni{justify-content:center;padding:0}body.rail .ni .lb,body.rail .ni .ct{display:none}
.ind{position:absolute;left:10px;right:10px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 20px rgba(242,135,58,.35);transition:transform .38s var(--ease),opacity .2s;pointer-events:none;top:0}
.tip{position:fixed;z-index:999;background:#0c0e12;border:1px solid var(--ln);padding:5px 10px;border-radius:8px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}
.sb-f{border-top:1px solid var(--ln);padding:10px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer;transition:.2s;white-space:nowrap}
.me:hover{background:var(--s2)}
.av{width:34px;height:34px;border-radius:50%;flex:none;background:linear-gradient(135deg,#2dd4bf,#3b82f6);display:grid;place-items:center;font-weight:600;color:#fff}
.me div{min-width:0;flex:1;overflow:hidden}.me b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis}.me small{color:var(--mu);font-size:11px}
body.rail .me>div,body.rail .me>span{display:none}body.rail .me{justify-content:center}
.menu{position:absolute;bottom:68px;left:10px;width:232px;background:#1f242c;border:1px solid var(--ln);border-radius:14px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.5);opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:.22s var(--ease)}
.menu.sh{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;gap:10px;width:100%;padding:9px 10px;border-radius:9px;text-align:left}
.menu button:hover{background:var(--s2)}

/* ── Main ── */
.mn{display:flex;flex-direction:column;min-width:0;height:100vh}
.tb{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--ln)}
.crumb{flex:1;min-width:0;color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--tx);font-weight:500}
.hb{display:none;width:36px;height:36px;border-radius:10px;background:var(--s2)}
.srch{position:relative}
.srch input{width:260px;height:38px;border-radius:11px;border:1px solid var(--ln);background:var(--s1);padding:0 14px 0 36px;outline:0;transition:.25s var(--ease)}
.srch input:focus{width:340px;border-color:rgba(242,135,58,.5);box-shadow:0 0 0 4px rgba(242,135,58,.1)}
.srch:before{content:'⌕';position:absolute;left:12px;top:7px;color:var(--mu);font-size:17px}
.qres{position:absolute;right:0;top:46px;width:380px;max-height:60vh;overflow:auto;background:#1f242c;border:1px solid var(--ln);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);padding:6px;z-index:50}
.qi{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.qi:hover,.qi.fc{background:var(--s2)}
.qi .d{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.qi b{display:block;font-weight:500;font-size:13px}.qi small{color:var(--mu);font-size:11.5px}
mark{background:rgba(242,135,58,.3);color:#ffd2ad;border-radius:3px}
.btn{height:38px;padding:0 16px;border-radius:11px;background:var(--s2);border:1px solid var(--ln);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.2s}
.btn:hover{background:var(--s3)}
.btn.pri{background:linear-gradient(135deg,var(--ac),#ea6b2b);border:0;color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(242,135,58,.3)}
.btn.pri:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;pointer-events:none}
.ib{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--mu);transition:.2s}
.ib:hover{background:var(--s2);color:var(--tx)}

.view{flex:1;overflow:auto;padding:22px}
.page{animation:pin .45s var(--ease)}
@keyframes pin{from{opacity:0;filter:blur(8px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}
.pt{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pt h1{font-size:26px;font-weight:600;letter-spacing:-.01em}
.pt p{color:var(--mu);font-size:13px}
.pt .sp{flex:1}
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--s1);border:1px solid var(--ln);border-radius:var(--r)}
.ch{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.ch h3{font-size:14px;font-weight:600;flex:1}
.ch small{color:var(--mu)}

/* Dashboard */
.dg{display:grid;grid-template-columns:1fr 340px;gap:16px}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:16px}
.k{border-radius:var(--r);padding:14px 16px;border:1px solid var(--ln);position:relative;overflow:hidden;transition:transform .25s var(--ease)}
.k:hover{transform:translateY(-3px)}
.k small{color:rgba(255,255,255,.65);font-size:12px;display:flex;gap:6px;align-items:center}
.k b{display:block;font-size:24px;font-weight:600;margin-top:4px}
.k:after{content:attr(data-i);position:absolute;right:10px;bottom:-6px;font-size:44px;opacity:.12}
.t1{background:linear-gradient(160deg,#4a3326,#2a2320)}.t2{background:linear-gradient(160deg,#21463f,#1d2826)}
.t3{background:linear-gradient(160deg,#4a4228,#26241e)}.t4{background:linear-gradient(160deg,#2d3a52,#1e232d)}
.t5{background:linear-gradient(160deg,#52292b,#291e20)}.t6{background:linear-gradient(160deg,#3b2f4f,#221f2a)}
.grp{padding:6px 16px 14px}
.grp h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5f6671;margin:12px 0 6px}
.br{display:grid;grid-template-columns:26px 1fr 28px;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.br .e{font-size:15px;text-align:center}
.br .t{display:flex;justify-content:space-between;font-size:12.5px;color:#c5cad1}.br .t b{color:#fff;font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--s2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .8s var(--ease)}
.eye{width:26px;height:26px;border-radius:8px;color:var(--mu);font-size:13px}
.eye:hover{background:var(--s2)}.eye.off{opacity:.35}
.br.off .t,.br.off .bar{opacity:.35}
.side-list{max-height:calc(100vh - 340px);overflow:auto}
.dg .mapcard{height:calc(100vh - 300px);min-height:380px}

/* Map */
.mapcard{position:relative;height:calc(100vh - 210px);min-height:420px;overflow:hidden}
.slot{position:absolute;inset:0}
#mapBox{position:absolute;inset:0;border-radius:var(--r);overflow:hidden}
#map{position:absolute;inset:0;background:#0e1014}
.mt{position:absolute;top:12px;right:12px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mt button,.mt select{width:38px;height:38px;border-radius:11px;background:rgba(20,23,29,.88);backdrop-filter:blur(8px);border:1px solid var(--ln);color:#cfd3d9;transition:.2s}
.mt select{width:auto;padding:0 8px;font-size:12px;outline:0}
.mt button:hover{color:#fff;border-color:rgba(242,135,58,.5)}
.mt button.on{background:linear-gradient(135deg,var(--ac),#ea6b2b);color:#fff;border-color:transparent}
.mcount{position:absolute;left:12px;top:12px;z-index:500;background:rgba(20,23,29,.88);backdrop-filter:blur(8px);border:1px solid var(--ln);padding:6px 12px;border-radius:20px;font-size:12px}
.pickbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:600;background:#1f242c;border:1px solid rgba(242,135,58,.5);padding:8px 8px 8px 16px;border-radius:14px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.5);white-space:nowrap}
body.picking #map{cursor:crosshair}
.leaflet-container{font-family:inherit;background:#0e1014}
.leaflet-popup-content-wrapper{background:#1f242c;color:var(--tx);border-radius:14px;border:1px solid var(--ln)}
.leaflet-popup-tip{background:#1f242c}
.leaflet-popup-content{margin:12px 14px;min-width:220px}
.leaflet-bar a{background:rgba(20,23,29,.9)!important;color:#cfd3d9!important;border-color:var(--ln)!important}
.leaflet-control-attribution{background:rgba(20,23,29,.7)!important;color:#6b7280!important}
.leaflet-control-attribution a{color:#9ca3af!important}
.pp h5{font-size:14px;margin-bottom:6px;display:flex;gap:6px}
.pp dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;max-height:220px;overflow:auto}
.pp dt{color:var(--mu)}.pp dd{text-align:right;word-break:break-word}
.pp .a{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.pp a,.pp button{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--s2);color:var(--tx);text-decoration:none}

/* Category */
.cg{display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:16px}
.lst{height:calc(100vh - 210px);min-height:420px;display:flex;flex-direction:column}
.flt{margin:12px 14px 6px;height:38px;border-radius:11px;border:1px solid var(--ln);background:var(--bg);padding:0 12px;outline:0}
.flt:focus{border-color:rgba(242,135,58,.5)}
.items{flex:1;overflow:auto;padding:6px 10px 12px}
.it{display:flex;gap:10px;padding:11px 10px;border-radius:12px;cursor:pointer;transition:background .2s;align-items:flex-start;animation:pin .35s var(--ease) both}
.it:hover{background:var(--s2)}.it.sel{background:rgba(242,135,58,.12);box-shadow:inset 3px 0 0 var(--ac)}
.it .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.it .b{flex:1;min-width:0}
.it b{font-weight:500;display:block}
.it .s{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mu);margin-top:2px}
.it .nl{font-size:11px;color:#fbbf24}
.it .ac{display:flex;gap:2px;opacity:0;transition:.2s}.it:hover .ac{opacity:1}
.more{margin:8px auto;display:block}
.empty{text-align:center;color:var(--mu);padding:50px 20px}.empty div{font-size:40px;opacity:.5}

/* Drawer / Modal */
.ov{position:fixed;inset:0;background:rgba(5,6,8,.55);backdrop-filter:blur(3px);z-index:1100;opacity:0;pointer-events:none;transition:.3s}
.ov.sh{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#1a1e25;border-left:1px solid var(--ln);z-index:1150;transform:translateX(100%);transition:transform .4s var(--ease);display:flex;flex-direction:column}
.dr.sh{transform:none}
body.picking .dr{transform:translateX(100%)}body.picking .ov{opacity:0;pointer-events:none}
.dh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--ln)}
.dh h3{flex:1;font-size:17px;font-weight:600}
.db{flex:1;overflow:auto;padding:18px 20px}
.df{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--ln)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fd{display:flex;flex-direction:column;gap:5px}.fd.w{grid-column:1/-1}
.fd label{font-size:12px;color:var(--mu)}
.fd input,.fd select,.fd textarea{height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);padding:0 12px;outline:0;transition:.2s;color-scheme:dark}
.fd textarea{height:auto;padding:10px 12px;resize:vertical}
.fd input:focus,.fd select:focus,.fd textarea:focus{border-color:rgba(242,135,58,.55);box-shadow:0 0 0 3px rgba(242,135,58,.1)}
.fd input:disabled{opacity:.5}
.loc{margin-top:16px;padding:14px;border-radius:14px;background:var(--bg);border:1px dashed rgba(242,135,58,.35)}
.loc .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.md{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.97);width:min(760px,94vw);max-height:88vh;background:#1a1e25;border:1px solid var(--ln);border-radius:18px;z-index:1160;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:.3s var(--ease)}
.md.sh{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.urow{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);margin-bottom:8px;font-size:13px}
.urow small{color:var(--mu);display:block;font-size:11px}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--s2)}
.tag.superadmin{background:rgba(242,135,58,.2);color:#ffc38f}.tag.admin{background:rgba(59,130,246,.2);color:#9cc3ff}
.pm{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-top:10px}
.pm h5{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:6px}
.pm .r{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12.5px}
.pm select{height:30px;border-radius:8px;background:var(--bg);border:1px solid var(--ln);padding:0 6px}

/* Login */
.lg{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:radial-gradient(800px 500px at 70% 20%,rgba(242,135,58,.16),transparent),var(--bg)}
.lgc{width:min(380px,92vw);padding:30px 28px;border-radius:22px;background:var(--s1);border:1px solid var(--ln);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pin .5s var(--ease)}
.lgc .logo{width:52px;height:52px;margin:0 auto 14px;font-size:18px}
.lgc h2{text-align:center;font-size:20px}.lgc p{text-align:center;color:var(--mu);font-size:13px;margin-bottom:20px}
.err{background:rgba(248,113,113,.12);color:#fca5a5;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}

.tst{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;z-index:3000;background:#262b34;border:1px solid var(--ln);padding:10px 18px;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);transition:.35s var(--ease);pointer-events:none}
.tst.sh{opacity:1;transform:translate(-50%,0)}.tst.er{border-color:rgba(248,113,113,.5)}
.demo{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(251,191,36,.15);color:#fcd34d}

@media(max-width:1280px){.kp{grid-template-columns:repeat(3,1fr)}.dg{grid-template-columns:1fr}.side-list{max-height:none}}
@media(max-width:960px){
  .app,body.rail .app{grid-template-columns:1fr}
  .sb{position:fixed;inset:0 auto 0 0;width:270px;transform:translateX(-100%);transition:transform .35s var(--ease)}
  body.nav .sb{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  body.rail .brand{display:block}body.rail .ni .lb,body.rail .ni .ct{display:inline}
  .colbtn{display:none}.hb{display:grid;place-items:center}
  .tb{padding:0 12px}.srch input,.srch input:focus{width:150px}.qres{width:min(380px,92vw);right:-60px}
  .view{padding:14px}.cg{grid-template-columns:1fr}
  .lst{height:auto;min-height:0}.items{max-height:55vh}
  .mapcard{height:60vh}.kp{grid-template-columns:repeat(2,1fr)}
  .fg{grid-template-columns:1fr}.pt h1{font-size:21px}
  .urow{grid-template-columns:1fr auto}.urow>:nth-child(2),.urow>:nth-child(3){display:none}
}
</style>
</head>
<body>

<div class="lg hide" id="login">
  <form class="lgc" id="lgForm">
    <div class="logo">คต</div>
    <h2>CDDP</h2>
    <p>ระบบข้อมูลเมืองดิจิทัล · เทศบาลตำบลคลองตำหรุ</p>
    <div class="err hide" id="lgErr"></div>
    <div class="fd" style="margin-bottom:12px"><label>ชื่อผู้ใช้</label><input id="lgU" autocomplete="username" autocapitalize="off" required></div>
    <div class="fd" style="margin-bottom:18px"><label>รหัสผ่าน</label><input id="lgP" type="password" autocomplete="current-password" required></div>
    <button class="btn pri" style="width:100%;justify-content:center" id="lgBtn">เข้าสู่ระบบ</button>
  </form>
</div>

<div class="app">
  <aside class="sb" id="sb">
    <div class="sb-h">
      <div class="logo">คต</div>
      <div class="brand"><b>CDDP</b><small>เทศบาลตำบลคลองตำหรุ</small></div>
      <button class="colbtn" id="colBtn" title="ย่อ/ขยายเมนู">⇤</button>
    </div>
    <nav class="nv" id="nav"><div class="ind" id="ind"></div><div id="navIn"></div></nav>
    <div class="sb-f">
      <div class="me" id="meBtn"><span class="av" id="meAv">?</span><div><b id="meName">-</b><small id="meRole">-</small></div><span style="color:var(--mu)">⌃</span></div>
      <div class="menu" id="menu">
        <button data-m="sheet">📑 เปิด Google Sheet</button>
        <button data-m="export">⬇️ ส่งออกข้อมูล (JSON)</button>
        <button data-m="users" class="hide" id="mUsers">👥 จัดการผู้ใช้และสิทธิ์</button>

const num = n => (+n || 0).toLocaleString('th-TH');

function fmt(f, v){
  if(v == null || v === '') return '';
  let s = String(v);
  if(/เบอร์|โทร/.test(f)){ const d = s.replace(/\D/g,''); if((d.length===9||d.length===8) && d[0]!=='0') return '0'+d; }
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const d = new Date(s); if(!isNaN(d)) return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}); }
  return s;
}
function toast(m, t){

}

// ══════════ API ══════════
async function api(action, p = {}){
  if(DEMO) return demo(action, p);
  const r = await fetch(API, {method:'POST', body: JSON.stringify({action, token: TOKEN, ...p})});
  const j = await r.json();
  if(j.error){
    if(/AUTH_REQUIRED/.test(j.error)){ signOutLocal('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'); }
    throw new Error(j.error);
  }
  return j;
}
function demo(a, p){
  const db = JSON.parse(localStorage.getItem('cddp_demo') || '{}');
  const put = () => localStorage.setItem('cddp_demo', JSON.stringify(db));
  const perms = {}; Object.keys(CATS).forEach(k => perms[k] = 3);
  const user = {username:'demo', name:'ผู้ใช้ทดลอง', role:'admin', pii:true, perms};
  if(a === 'save'){
    const l = db[p.cat] = db[p.cat] || [];
    let r = p.rec.id && l.find(x => x.id === p.rec.id);
    if(!r){ r = {id: Date.now().toString(36)}; l.push(r); }
    Object.assign(r, p.rec, {ts: new Date().toISOString().slice(0,16).replace('T',' ')}); put();
    return {ok:true, rec:r};
  }
  if(a === 'remove'){ db[p.cat] = (db[p.cat]||[]).filter(x => x.id !== p.id); put(); return {ok:true}; }
  return {data: db, user};
}

function showLogin(msg){

}
function signOutLocal(msg){
  TOKEN = ''; USER = null; DATA = {}; sessionStorage.removeItem('cddp_t'); showLogin(msg);
}
$('#lgForm').addEventListener('submit', async e => {
  e.preventDefault();

  try{
    const j = await api('login', {username: $('#lgU').value, password: $('#lgP').value});
    TOKEN = j.token; sessionStorage.setItem('cddp_t', TOKEN); $('#lgP').value = '';
    await loadAll();
    toast('ยินดีต้อนรับ ' + USER.name);
  }catch(err){ showLogin(err.message); }

});

const TILES = {
  gsat:['https://mt{s}.google.com/vt?lyrs=y&hl=th&x={x}&y={y}&z={z}',{subdomains:'0123',maxZoom:21,attribution:'© Google'}],
  groad:['https://mt{s}.google.com/vt?lyrs=m&hl=th&x={x}&y={y}&z={z}',{subdomains:'0123',maxZoom:21,attribution:'© Google'}],
  esri:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:19,attribution:'© Esri'}],
  light:['https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{subdomains:'abcd',maxZoom:21,maxNativeZoom:19,attribution:'© OSM © CARTO'}],
  dark:['https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',{subdomains:'abcd',maxZoom:21,maxNativeZoom:19,attribution:'© OSM © CARTO'}]

const BND = BOUNDARY_RAW.trim().split(/\s+/).map(p => { const x = p.split(','); return [+x[1], +x[0]]; });
const map = L.map('map', {preferCanvas:true, zoomControl:false, minZoom:12, maxZoom:21});
L.control.zoom({position:'bottomright'}).addTo(map);
const bnd = L.polygon(BND, {color:'#f2873a', weight:2.5, dashArray:'8 6', fillColor:'#f2873a', fillOpacity:.04, interactive:false}).addTo(map);
map.fitBounds(bnd.getBounds(), {padding:[20,20]});
map.setMaxBounds(bnd.getBounds().pad(.8));
const pts = L.featureGroup().addTo(map);
const MB = $('#mapBox');
const roadL = L.layerGroup(ROAD_LINES.map(r => L.polyline(r.c, {color:'#fbbf24', weight:4, opacity:.9}).bindTooltip(r.n, {sticky:true})));
const waterL = L.layerGroup(WATERWAY_LINES.map(w => L.polyline(w.c, {color:'#38bdf8', weight:5, opacity:.85}).bindTooltip(w.n, {sticky:true})));
let tile = null;
function setBase(k){
  if(tile) map.removeLayer(tile);
  const t = TILES[k]; tile = L.tileLayer(t[0], t[1]).addTo(map); tile.bringToBack();
  $('#baseSel').value = k; localStorage.setItem('cddp_base', k);
  let err = 0, ok = false;
  if(k !== 'esri'){
    tile.on('tileload', () => ok = true);
    tile.on('tileerror', () => { if(++err === 4 && !ok){ setBase('esri'); toast('แผนที่ฐานโหลดไม่ได้ สลับเป็นแผนที่สำรองแล้ว'); } });
  }
}
setBase(localStorage.getItem('cddp_base') || 'gsat');
$('#baseSel').onchange = e => setBase(e.target.value);
new ResizeObserver(() => map.invalidateSize()).observe($('#map'));

function mountMap(){
  const s = $('#slot'); if(s){ s.appendChild(MB); map.invalidateSize(false); setTimeout(() => map.invalidateSize(), 60); }
}
function renderMap(fit){
  pts.clearLayers(); MK = {};
  const ks = CUR ? [CUR] : Object.keys(CATS).filter(k => lv(k) && !HIDDEN.has(k));
  let n = 0;
  ks.forEach(k => { const c = CATS[k];
    (DATA[k]||[]).forEach(r => {
      const la = +r.lat, ln = +r.lng; if(!la || !ln) return;
      const m = L.circleMarker([la, ln], {radius: CUR ? 8 : 6, color:'#fff', weight:2, fillColor:c.c, fillOpacity:1})
        .bindPopup(() => popup(k, r), {maxWidth:300}).addTo(pts);
      MK[k + ':' + r.id] = m; n++;
    });
  });
  $('#mcount').textContent = num(n) + ' จุด' + (CUR ? '' : ' · ' + ks.length + ' หมวด');
  if(fit){
    if(CUR && n) map.flyToBounds(pts.getBounds(), {padding:[50,50], maxZoom:17, duration:.7});
    else map.flyToBounds(bnd.getBounds(), {padding:[20,20], duration:.7});
  }
}
function popup(k, r){
  const c = CATS[k];
  const rows = c.f.filter(f => r[f] !== '' && r[f] != null).map(f => `<dt>${esc(f)}</dt><dd>${esc(fmt(f, r[f]))}</dd>`).join('');

    <div class="a"><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${+r.lat},${+r.lng}">🧭 นำทาง</a>

function focusRec(k, id){

function autoLines(){

function field(f, v){
  v = v ?? ''; const n = `name="${esc(f)}"`, val = esc(v);
  const w = (inner, wide, note) => `<div class="fd${wide?' w':''}"><label>${esc(f)}${note?` <small>· ${note}</small>`:''}</label>${inner}</div>`;
  if(PII.test(f) && USER && !USER.pii) return w(`<input value="${val}" disabled>`, 0, 'ปิดบังตาม PDPA');
  if(/หมายเหตุ|รายละเอียด/.test(f)) return w(`<textarea ${n} rows="3">${val}</textarea>`, 1);
  if(OPTS[f]){ const l = OPTS[f].includes(String(v)) || !v ? OPTS[f] : [...OPTS[f], String(v)];
    return w(`<select ${n}><option value=""></option>${l.map(x => `<option${x===String(v)?' selected':''}>${esc(x)}</option>`).join('')}</select>`); }
  if(/^วัน(?!เปิด)|เกิด|ตรวจ/.test(f)) return w(`<input type="date" ${n} value="${val.slice(0,10)}">`);
  if(/จำนวน|อายุ|ความยาว|ความกว้าง|เงิน/.test(f)) return w(`<input type="number" step="any" ${n} value="${val}">`);
  if(/เบอร์|โทร/.test(f)) return w(`<input type="tel" ${n} value="${esc(fmt(f, v))}" placeholder="0XX-XXX-XXXX">`);
  return w(`<input ${n} value="${val}">`);
}

        </div>
        <div class="row"><button type="button" class="btn sm" id="pickBtn">🗺️ เลือกบนแผนที่</button><button type="button" class="btn sm" id="gpsBtn">📡 ใช้ตำแหน่งปัจจุบัน</button></div>
      </div>
      ${r.updated_by ? `<p style="color:var(--mu);font-size:12px;margin-top:12px">แก้ไขล่าสุด ${esc(r.ts||'')} โดย ${esc(r.updated_by)}</p>` : ''}

function setLL(la, ln){ const f = $('#fm'); if(!f) return; f.lat.value = (+la).toFixed(6); f.lng.value = (+ln).toFixed(6); }
function closeDrawer(){ endPick(); $('#dr').classList.remove('sh'); $('#ov').classList.remove('sh'); EID = null; }
$('#ov').onclick = () => { closeDrawer(); closeModal(); };
async function saveForm(e){
  e.preventDefault();
  const rec = {}; new FormData($('#fm')).forEach((v, k) => rec[k] = String(v).trim());
  if(!(+rec.lat) || !(+rec.lng)) return toast('กรุณาระบุตำแหน่ง', 'er');

  const b = $('#drS'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
  try{
    const j = await api('save', {cat: CUR, rec});
    const l = DATA[CUR] = DATA[CUR] || [];
    const i = l.findIndex(x => String(x.id) === String(j.rec.id));
    i >= 0 ? l[i] = j.rec : l.push(j.rec);
    closeDrawer(); renderNav(); renderList(); renderMap();
    toast(EID ? 'แก้ไขเรียบร้อย' : 'เพิ่มข้อมูลเรียบร้อย');
    setTimeout(() => focusRec(CUR, j.rec.id), 200);
  }catch(err){ toast('บันทึกไม่สำเร็จ: ' + err.message, 'er'); b.disabled = false; b.textContent = '💾 บันทึก'; }

async function removeRec(id){

// ══════════ GLOBAL SEARCH ══════════
let qT;
$('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(search, 140); });
$('#q').addEventListener('focus', search);
$('#q').addEventListener('keydown', e => {
  const it = [...document.querySelectorAll('.qi')]; if(!it.length) return;
  let i = it.findIndex(x => x.classList.contains('fc'));
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); it[i]?.classList.remove('fc'); i = (i + (e.key==='ArrowDown'?1:-1) + it.length) % it.length; it[i].classList.add('fc'); it[i].scrollIntoView({block:'nearest'}); }
  if(e.key === 'Enter') (it[i] || it[0]).click();
  if(e.key === 'Escape') $('#qres').classList.add('hide');
});
function search(){
  const q = $('#q').value.trim().toLowerCase(), box = $('#qres');
  if(!q) return box.classList.add('hide');
  const res = [];
  for(const k of Object.keys(DATA)){ const c = CATS[k]; if(!c) continue;
    for(const r of DATA[k]){
      const f = c.f.find(f => String(r[f] ?? '').toLowerCase().includes(q));
      if(f) res.push({k, r, f, s: f === c.f[0] ? 2 : 1});
    }
  }
  res.sort((a, b) => b.s - a.s);
  box.innerHTML = res.length ? res.slice(0, 20).map((m, i) => { const c = CATS[m.k];
    return `<div class="qi${i?'':' fc'}" data-k="${m.k}" data-id="${esc(m.r.id)}"><span class="d" style="background:${c.c}33">${c.i}</span>
      <div><b>${hl(m.r[c.f[0]] || '(ไม่ระบุ)', q)}</b><small>${esc(c.l)}${m.f!==c.f[0]?' · '+esc(m.f)+': '+hl(m.r[m.f], q):''}</small></div></div>`;
  }).join('') + (res.length > 20 ? `<div class="qi" style="cursor:default"><small>และอีก ${num(res.length-20)} รายการ…</small></div>` : '')
  : '<div class="empty" style="padding:24px">ไม่พบข้อมูล</div>';
  box.classList.remove('hide');
}
$('#qres').addEventListener('click', e => {
  const t = e.target.closest('.qi[data-k]'); if(!t) return;
  $('#qres').classList.add('hide'); $('#q').blur();
  const {k, id} = t.dataset;
  if(CUR !== k) go(k);
  setTimeout(() => focusRec(k, id), CUR === k ? 0 : 750);
});

// ══════════ EXPORT ══════════
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportJSON(){ download('CDDP_' + new Date().toISOString().slice(0,10) + '.json', JSON.stringify(DATA, null, 2), 'application/json'); }
function exportCSV(){
  const c = CATS[CUR], h = [...c.f, 'lat', 'lng', 'ts', 'updated_by'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = '﻿' + [h.map(q).join(','), ...(DATA[CUR]||[]).map(r => h.map(f => q(r[f])).join(','))].join('\n');
  download(c.l + '.csv', csv, 'text/csv');
}

  $('#pwF').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    if(f.n.value !== f.n2.value) return toast('ยืนยันรหัสผ่านไม่ตรงกัน', 'er');
    try{ await api('changePassword', {oldPw: f.o.value, newPw: f.n.value}); toast('เปลี่ยนรหัสผ่านแล้ว'); closeModal(); }
    catch(err){ toast(err.message, 'er'); }
  };
}

let UL = [];
async function openUsers(){
  modal(`<div class="dh"><h3>👥 ผู้ใช้และสิทธิ์</h3><button class="ib" data-x>✕</button></div><div class="db" id="ub">กำลังโหลด…</div>`);
  try{ UL = (await api('listUsers')).users; userList(); }catch(err){ toast(err.message, 'er'); closeModal(); }
}
function userList(){
  const R = {superadmin:'ผู้ดูแลสูงสุด', admin:'ผู้ดูแลระบบ', user:'เจ้าหน้าที่'};
  $('#ub').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="color:var(--mu)">${UL.length} บัญชี</span><button class="btn pri sm" id="uNew">＋ เพิ่มผู้ใช้</button></div>` +
    UL.map(u => `<div class="urow"><div><b>${esc(u.name)}</b><small>${esc(u.username)}</small></div>
      <div><span class="tag ${esc(u.role)}">${R[u.role]||u.role}</span>${u.pii?'<small style="color:#fcd34d">เห็นเลขบัตร</small>':''}</div>
      <div>${u.status==='disabled'?'<span style="color:var(--er)">ระงับ</span>':'ใช้งาน'}<small>${esc(u.last_login||'ยังไม่เคยเข้า')}</small></div>
      <div><button class="ib" data-ue="${esc(u.username)}">✎</button>${u.username!==USER.username?`<button class="ib" data-ud="${esc(u.username)}">🗑</button>`:''}</div></div>`).join('');
  $('#uNew').onclick = () => userForm(null);
  $('#ub').onclick = async e => {
    const ed = e.target.closest('[data-ue]'), dl = e.target.closest('[data-ud]');
    if(ed) userForm(UL.find(u => u.username === ed.dataset.ue));
    if(dl && confirm('ลบบัญชี ' + dl.dataset.ud + ' ?')){
      try{ await api('deleteUser', {username: dl.dataset.ud}); UL = UL.filter(u => u.username !== dl.dataset.ud); userList(); toast('ลบผู้ใช้แล้ว'); }
      catch(err){ toast(err.message, 'er'); }
    }
  };
}
function userForm(u){
  const p = (u && u.perms) || {};
  const sel = (k, v) => `<select name="p_${k}">${[['','ปิด'],['r','ดู'],['w','แก้ไข'],['d','ลบ']].map(([a,b]) => `<option value="${a}"${(v||'')===a?' selected':''}>${b}</option>`).join('')}</select>`;
  $('#ub').innerHTML = `<form id="uF"><div class="fg">
    <div class="fd"><label>ชื่อผู้ใช้ *</label><input name="username" value="${esc(u?.username||'')}" ${u?'readonly':''} required pattern="[a-z0-9._\\-]{3,30}" placeholder="somchai.k"></div>
    <div class="fd"><label>ชื่อ-นามสกุล *</label><input name="name" value="${esc(u?.name||'')}" required></div>
    <div class="fd"><label>บทบาท</label><select name="role">${[['user','เจ้าหน้าที่ (กำหนดรายหมวด)'],['admin','ผู้ดูแลระบบ (ทุกหมวด)'],['superadmin','ผู้ดูแลสูงสุด (จัดการผู้ใช้)']].map(([a,b]) => `<option value="${a}"${(u?.role||'user')===a?' selected':''}>${b}</option>`).join('')}</select></div>
    <div class="fd"><label>สถานะ</label><select name="status"><option value="active">ใช้งาน</option><option value="disabled"${u?.status==='disabled'?' selected':''}>ระงับ</option></select></div>
    <div class="fd w"><label>${u?'ตั้งรหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)':'รหัสผ่าน * (อย่างน้อย 8 ตัว)'}</label><input name="password" type="text" minlength="8" ${u?'':'required'}></div>
    <label class="fd w" style="flex-direction:row;gap:8px;align-items:center;font-size:13px"><input type="checkbox" name="pii" ${u?.pii?'checked':''} style="height:auto"> อนุญาตให้เห็นเลขบัตรประชาชนเต็ม (ข้อมูลอ่อนไหว PDPA)</label>
  </div>
  <div id="pmw">${GROUPS.map(([g, gl], gi) => `<div class="pm"><h5>${gl}<select data-gs="${g}"><option value="-">ตั้งทั้งกลุ่ม…</option><option value="">ปิด</option><option value="r">ดู</option><option value="w">แก้ไข</option><option value="d">ลบ</option></select></h5>
    ${keysOf(g).map(k => `<div class="r"><span>${CATS[k].i} ${esc(CATS[k].l)}</span>${sel(k, p[k])}</div>`).join('')}</div>`).join('')}</div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button type="button" class="btn" id="uBack">← กลับ</button><button class="btn pri">💾 บันทึก</button></div></form>`;
  const F = $('#uF');
  const tg = () => $('#pmw').classList.toggle('hide', F.role.value !== 'user'); tg(); F.role.onchange = tg;
  F.querySelectorAll('[data-gs]').forEach(s => s.onchange = () => { if(s.value === '-') return;
    keysOf(s.dataset.gs).forEach(k => F['p_'+k].value = s.value); s.value = '-'; });
  $('#uBack').onclick = userList;
  F.onsubmit = async e => {
    e.preventDefault();
    const d = {username: F.username.value.trim().toLowerCase(), name: F.name.value.trim(), role: F.role.value,
      status: F.status.value, pii: F.pii.checked, perms: {}};
    if(F.password.value) d.password = F.password.value;
    Object.keys(CATS).forEach(k => { if(F['p_'+k].value) d.perms[k] = F['p_'+k].value; });
    try{ await api('saveUser', {user: d}); UL = (await api('listUsers')).users; userList(); toast('บันทึกผู้ใช้แล้ว'); }
    catch(err){ toast(err.message, 'er'); }
  };
}

document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeDrawer(); closeModal(); } if(e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $('#q').focus(); } });
(async () => {
  if(!DEMO && !TOKEN) return showLogin();
  try{ await loadAll(); }catch(err){ if(!$('#login').classList.contains('hide')) return; DEMO ? toast(err.message,'er') : showLogin(); }
})();
